# jev-review core viewpoints (English)
#
# How these are written (measurements in docs/findings.md):
# - One fact per viewpoint. Joining conditions with AND loses recall (96% with 1 -> 73% with 4).
# - Ask for presence ("is there ...?"). Absence questions fired on 77% of clean diffs.
# - Name the forms you want found. With "such as", only the listed kinds are detected.
# - At most three exceptions, most important first.
# - Bugs that need the intent to spot (an inverted comparison, a None dereference) are left out:
#   Jev did not catch them reliably.

[review]
name = "core.en"
language = "en"
red = 0.7
yellow = 0.5

# ---- secrets ---------------------------------------------------------------------

[[viewpoint]]
id = "hardcoded_secret"
severity = "high"
question = "Does an added line contain an API key, token, password or private key written as a literal string, for example a value starting with sk-, ghp_, AIza, AKIA or xoxb-, or a long random alphanumeric value?"
exceptions = [
  "Ignore test or documentation values that contain dummy, test, sample or xxxx.",
  "Ignore the apiKey inside a JavaScript firebaseConfig object.",
  "Ignore examples shown inside comments.",
]

# ---- injection -------------------------------------------------------------------

[[viewpoint]]
id = "sql_injection"
severity = "high"
question = "Does an added line put an external value into an SQL statement by concatenation or interpolation (+, ||, f-string, format, %, template literal)?"
exceptions = [
  "Ignore concatenation of constants defined in the code.",
  "Ignore values passed through placeholders such as ?, $1 or :name.",
]

[[viewpoint]]
id = "shell_injection"
severity = "high"
question = "Does an added line run a shell command string that contains an external value, through os.system, subprocess with shell=True, child_process.exec, backticks, or ${{ github.event.* }} / ${{ github.head_ref }} written directly inside a GitHub Actions run: step?"
exceptions = ["Ignore test code (files under tests/ or named test_*)."]

[[viewpoint]]
id = "code_eval"
severity = "high"
question = "Does an added line execute an external value as code with eval, exec, new Function or Function()?"
exceptions = ["Ignore test code (files under tests/ or named test_*)."]

[[viewpoint]]
id = "html_injection"
severity = "high"
question = "Does an added line insert an external value into the page HTML through innerHTML, outerHTML, insertAdjacentHTML, document.write, dangerouslySetInnerHTML or v-html?"

[[viewpoint]]
id = "remote_script"
severity = "high"
question = "Does an added line pipe a script downloaded from the network straight into a shell, written as curl ... | bash, curl ... | sh, wget -O- ... | sh or iex (irm ...)?"

[[viewpoint]]
id = "unsafe_delete"
severity = "high"
question = "Does an added line run rm -rf, rm -r or Remove-Item -Recurse on a path built from a variable that can be empty, without quotes or a ${VAR:?} check?"

# ---- error handling ----------------------------------------------------------------

[[viewpoint]]
id = "swallowed_error"
severity = "medium"
question = "Does an added line catch or ignore a failure and do nothing, written as except: pass, catch (e) {}, || true, try?, an error return assigned to _, or continue-on-error: true?"
exceptions = [
  "Ignore cases that log the error and then continue.",
  "Ignore cases that only ignore 'already gone' errors such as FileNotFoundError.",
  "Ignore failures of cleanup code such as close() inside finally.",
]

# ---- development leftovers -----------------------------------------------------------

[[viewpoint]]
id = "debug_leftover"
severity = "low"
question = "Does an added line contain debug output labeled DEBUG (print, console.log, NSLog, fmt.Println, puts) or a TODO that says to remove it later or marks it temporary?"
exceptions = [
  "Ignore test code (files under tests/ or named test_*).",
  "Ignore output that a CLI main function prints to show results to the user.",
]

# ---- cost ----------------------------------------------------------------------

[[viewpoint]]
id = "paid_api_without_guard"
severity = "high"
question = "Does an added line call a pay-per-use API (generative AI, image, video or speech generation) with no spending or count limit checked before the call?"

# ---- named bug shapes ---------------------------------------------------------------
# Only shapes that are visible in the text.

[[viewpoint]]
id = "loop_off_by_one"
severity = "medium"
question = "Does an added loop use an end condition that is off by one from the array bounds, written as i <= len(xs), i <= arr.length, i <= len(xs) in Go, or range(0, len(xs) - 1)?"

[[viewpoint]]
id = "assignment_in_condition"
severity = "medium"
question = "Does an added if or while condition contain an assignment (=) where a comparison (== or ===) was meant?"

[[viewpoint]]
id = "null_equality"
severity = "medium"
question = "Does added SQL compare with NULL using = NULL or != NULL instead of IS NULL?"

[[viewpoint]]
id = "unbounded_wait_loop"
severity = "medium"
question = "Does an added line start a while True, while (true) or for (;;) waiting loop that has neither a retry limit nor a timeout?"

[[viewpoint]]
id = "unclosed_resource"
severity = "low"
question = "Does an added line open a file or connection with open(), fopen, os.Open or sql.Open and use it without closing it through with, defer, try-with-resources or finally?"
