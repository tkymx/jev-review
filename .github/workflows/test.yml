name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: PYTHONPATH=src:tests python -m unittest discover -s tests -v
      - name: Bundled viewpoints pass the linter
        run: |
          PYTHONPATH=src python -m jev_review lint --strict core.en core.ja
      - name: Package installs and runs
        run: |
          pip install .
          jev-review --version
          jev-review run --patch examples/sample.patch -v core.en --dry-run
